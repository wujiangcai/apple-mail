name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Lint Python
        run: python -m ruff check .
      - name: Compile Python
        run: python -m compileall -q mail_manager tests
      - name: Run unit tests
        run: python -m pytest tests -m "not postgres" --cov=mail_manager --cov-fail-under=85
      - name: Audit Python dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip_audit -r requirements.lock

  postgres-integration:
    name: PostgreSQL 17 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mail_manager_test
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: mail_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mail_manager_test -d mail_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://mail_manager_test:integration-only-password@127.0.0.1:5432/mail_manager_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/test_postgres_integration.py -v

  frontend:
    name: Node 24 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Vitest
        run: npm test
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Gitleaks full history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
